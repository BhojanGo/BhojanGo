[project]
name = "bhojango-backend"
version = "0.1.0"
description = "BhojanGo backend: core_api, realtime and worker deployables plus shared code"
requires-python = ">=3.12"
# Merged from the six services/*/pyproject.toml files (Poetry caret ranges
# converted to PEP 440). All services pinned the same ranges, so there were no
# version conflicts to resolve.
dependencies = [
    "fastapi>=0.111.0,<0.112",
    "uvicorn[standard]>=0.30.0,<0.31",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29.0,<0.30",
    "alembic>=1.13.1,<2",
    "pydantic>=2.7.1,<3",
    "pydantic-settings>=2.3.0,<3",
    "python-jose[cryptography]>=3.3.0,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    # passlib 1.7 breaks on bcrypt >= 4.1 (hashing raises on its 72-byte probe).
    "bcrypt>=4.0.1,<4.1",
    "redis[hiredis]>=5.0.5,<6",
    "httpx>=0.27.0,<0.28",
    "tenacity>=8.3.0,<9",
    "structlog>=24.2.0,<25",
    "slowapi>=0.1.9,<0.2",
    "prometheus-fastapi-instrumentator>=7.0.0,<8",
    "boto3>=1.34.100,<2",
    "twilio>=9.1.1,<10",
    "google-auth>=2.30.0,<3",
    "PyJWT>=2.8.0,<3",
    "cryptography>=42.0.7,<43",
    "python-multipart>=0.0.9,<0.0.10",
    "email-validator>=2.1.1,<3",
    "stripe>=9.9.0,<10",
    "razorpay>=1.4.1,<2",
    # razorpay imports pkg_resources, which setuptools 81 removed.
    "setuptools<81",
    "opensearch-py>=2.6.0,<3",
    "geoalchemy2>=0.15.1,<0.16",
    "websockets>=12.0,<13",
    "sendgrid>=6.11.0,<7",
    "firebase-admin>=6.5.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9",
    "pytest-asyncio>=0.23.7,<0.24",
    "pytest-cov>=5.0.0,<6",
    "anyio>=4.4.0,<5",
    "aiosqlite>=0.20.0,<0.21",
    "factory-boy>=3.3.0,<4",
    "faker>=25.2.0,<26",
]

[tool.uv]
# Not an installable package: deployables run from this directory
# (core_api.main:app) or from their own folder (realtime/app, worker/app).
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `shared` and `core_api` import from backend/. realtime and worker each have a
# package called `app`, so run them in separate pytest invocations:
#   uv run pytest core_api && uv run pytest realtime && uv run pytest worker
pythonpath = ["."]

[tool.coverage.run]
omit = ["*/tests/*", "migrations/*"]
