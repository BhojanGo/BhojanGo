[project]
name = "bhojango-backend"
version = "0.1.0"
description = "BhojanGo backend: core_api, realtime and worker deployables plus shared code"
requires-python = ">=3.12"
dependencies = [
    # Versions per ADR-011 (P3, Nov 2026): latest releases, capped below the next
    # major (or next minor for 0.x packages).
    "fastapi>=0.162.4,<0.163",
    "uvicorn[standard]>=0.54.0,<0.55",
    "sqlalchemy[asyncio]>=2.1.8,<3",
    "asyncpg>=0.32.0,<0.33",
    "alembic>=1.20.1,<2",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.16.2,<3",
    "python-jose[cryptography]>=3.5.0,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    # passlib 1.7 (unmaintained) breaks on bcrypt >= 4.1. P5's auth rewrite drops passlib.
    "bcrypt>=4.0.1,<4.1",
    "redis[hiredis]>=8.1.0,<9",
    "httpx>=0.28.1,<0.29",
    "tenacity>=9.2.1,<10",
    "structlog>=26.1.0,<27",
    "slowapi>=0.1.10,<0.2",
    "prometheus-fastapi-instrumentator>=8.1.0,<9",
    "boto3>=1.44.0,<2",
    "twilio>=9.13.0,<10",
    "google-auth>=2.62.2,<3",
    "PyJWT>=2.15.1,<3",
    "cryptography>=50.0.2,<51",
    "python-multipart>=0.0.33,<0.0.34",
    "email-validator>=2.3.0,<3",
    "stripe>=16.1.0,<17",
    "razorpay>=2.0.1,<3",
    "opensearch-py>=3.2.0,<4",
    "geoalchemy2>=0.21.0,<0.22",
    "websockets>=17.4,<18",
    "sendgrid>=6.12.5,<7",
    "firebase-admin>=7.7.0,<8",
    "aiosmtplib>=5,<6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1,<2",
    "pytest-cov>=7.1.0,<8",
    "anyio>=4.16.0,<5",
    "aiosqlite>=0.22.1,<0.23",
    "factory-boy>=3.3.3,<4",
    "faker>=40.54.0,<41",
]

[tool.uv]
# Not an installable package: deployables run from this directory
# (core_api.main:app) or from their own folder (realtime/app, worker/app).
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `shared` and `core_api` import from backend/. realtime and worker each have a
# package called `app`, so run them in separate pytest invocations:
#   uv run pytest core_api && uv run pytest realtime && uv run pytest worker
pythonpath = ["."]

[tool.coverage.run]
omit = ["*/tests/*", "migrations/*"]
