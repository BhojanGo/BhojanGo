name: End-to-end (Playwright)

# P22: the web and admin end-to-end runs on every pull request, against the
# same stack as `make dev` (Docker Compose, LocalStack, seeded data). G1 and the
# contract tests run in PR Checks (backend-checks.yml). Maestro flows for the
# three apps run on Android emulators (tools/mobile/e2e.sh); see docs/PLAYBOOK.md.

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright web + admin
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: bhojango-e2e
      COMPOSE: docker compose -f infra/docker/compose.yaml
      DEMO_RIDER_SIM: "0"  # the demo rider simulator stays off while tests run
      POSTGRES_DB: bhojango_e2e_test  # R42: tests write only to a test database (tools/target_guard.py)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free disk space (the runner's unused SDKs; the stack's images need ~20 GB)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h / | tail -1

      - name: Host tools for the runs (opening hours helper)
        run: pip install httpx==0.28.1

      - name: Start the stack (make dev)
        run: $COMPOSE --profile all up -d --build --wait --wait-timeout 600

      - name: Seed
        run: $COMPOSE exec -T core-api python /srv/tools/seed/seed.py

      - name: Web (customer site)
        run: sh tools/web/e2e.sh

      - name: Admin console
        if: always()
        run: sh tools/admin/e2e.sh

      # R27: every page in every language of each live country at 360 and 1440 px: no sideways
      # scroll, no site text cut off or spilling out of its box (a gate: no continue-on-error).
      - name: Every page in every language fits (360 and 1440 px)
        if: always()
        run: sh tools/web/i18n_layout.sh

      # R41: every website and admin page, a US and an India user, 1440 and 390 px: status, page errors, overflow,
      # cut-off text, text under bottom bars, wording, untranslated keys, currency, phone format, weekday vs date.
      - name: Every page swept (R41)
        if: always()
        run: sh tools/sweep/sweep.sh

      # R9: axe-core runs on the main pages of both suites (serious or critical fails them);
      # every finding, of every impact, goes to the run's summary and the screenshots artifact.
      - name: Accessibility report (axe)
        if: always()
        run: |
          for f in docs/screenshots/web/a11y-web.md docs/screenshots/admin/a11y-admin.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 300 core-api realtime worker web admin

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            docs/screenshots/web
            docs/screenshots/admin
            docs/screenshots/web-i18n
            docs/screenshots/sweep
          retention-days: 7

      - name: Stop
        if: always()
        run: $COMPOSE down -v

  # A third city and a third country from the admin console alone (no code
  # change): Meridian (US) and Wellington (New Zealand: NZD, GST, +64), each
  # with a zone and a kitchen; the website must pick both up from data.
  third-city:
    name: Third city and third country
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the runner's unused SDKs; the stack's images need ~20 GB)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h / | tail -1

      - name: Meridian and Wellington on a clean stack (make web-third-city)
        run: make web-third-city

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: third-city-screenshots
          path: docs/screenshots/web-v2/third-city
          retention-days: 7

  # R42: every function of every website and admin page (tools/sweep/functional: the money path, fees by level,
  # finance with a second admin, chargebacks, permits, ...), as a US and an India user, numbers compared to the API and
  # the database; then every page again with core-api stopped. On its own stack and test database.
  functional:
    name: Functional pages (R42)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: bhojango-fn
      COMPOSE: docker compose -f infra/docker/compose.yaml
      DEMO_RIDER_SIM: "0"
      POSTGRES_DB: bhojango_functional_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free disk space (the runner's unused SDKs; the stack's images need ~20 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h / | tail -1

      - name: Host tools for the runs (opening hours helper)
        run: pip install httpx==0.28.1

      - name: Start the stack (make dev)
        run: $COMPOSE --profile all up -d --build --wait --wait-timeout 600

      - name: Seed and demo data (promo codes, order history for Finance)
        run: |
          $COMPOSE exec -T core-api python /srv/tools/seed/seed.py >/dev/null
          $COMPOSE exec -T core-api python /srv/tools/seed/demo.py >/dev/null

      - name: Every page's functions, then every page with core-api stopped
        run: OUT="$PWD/qa-artifacts/r42/functional" sh tools/sweep/functional/run.sh

      - name: Report (index.md)
        if: always()
        run: python tools/sweep/functional/index.py qa-artifacts/r42/functional

      - name: Results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-pages
          path: qa-artifacts/r42/functional
          retention-days: 7

      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200 core-api web admin

      - name: Stop
        if: always()
        run: $COMPOSE down -v
