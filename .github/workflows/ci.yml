name: CI/CD Pipeline

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: bhojango-prod-cluster

jobs:
  # ──────────────────────────────────────────
  # Frontend: lint + typecheck + build
  # ──────────────────────────────────────────
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Lint
        run: pnpm turbo lint --filter='./apps/*' --filter='./packages/*'

      - name: Type check
        run: pnpm turbo typecheck --filter='./apps/*' --filter='./packages/*'

      - name: Test
        run: pnpm turbo test --filter='./apps/*' --filter='./packages/*'

  # ──────────────────────────────────────────
  # Backend: one uv project, three deployables
  # ──────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://bhojango:bhojango_test@localhost:5432/bhojango_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: test_jwt_secret_for_ci_minimum_32_characters
      APP_ENV: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # realtime and worker each have an `app` package, so they run separately.
      - name: Test core_api
        run: uv run pytest core_api -v --tb=short
      - name: Test realtime
        run: uv run pytest realtime -v --tb=short
      - name: Test worker
        run: uv run pytest worker -v --tb=short

  # ──────────────────────────────────────────
  # Migrations (+ alembic check, API on a migrated DB) and Docker builds.
  # Shared with pr-checks.yml via a reusable workflow.
  # ──────────────────────────────────────────
  backend-checks:
    name: Backend checks
    needs: [frontend, backend-test]
    uses: ./.github/workflows/backend-checks.yml

  # ──────────────────────────────────────────
  # Deploy to ECS (only when AWS secrets exist)
  # ──────────────────────────────────────────
  # Job-level `if` can't read secrets, so a tiny job reports whether AWS is set up.
  aws-configured:
    name: Check AWS credentials
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: echo "enabled=$([ -n "$AWS_ACCOUNT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [backend-checks, aws-configured]
    if: needs.aws-configured.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        # ECS services/ECR repos for these three are created when P4 trims
        # infra/terraform; until then this job has nothing to deploy to.
        include:
          - image: core_api
            service: core-api
          - image: realtime
            service: realtime
          - image: worker
            service: worker

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/bhojango-prod/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/bhojango-prod/${{ matrix.service }}:latest

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service bhojango-prod-${{ matrix.service }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
