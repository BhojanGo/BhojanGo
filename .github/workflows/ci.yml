name: CI/CD Pipeline

# Merge to dev: full checks, then build, push, migrate and deploy to staging.
# The deploy is skipped (not failed) until AWS is connected, i.e. until the
# repository variable AWS_STAGING_DEPLOY_ROLE_ARN exists (docs/runbooks/aws-setup.md).
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ──────────────────────────────────────────
  # Frontend: build packages, lint, typecheck, test
  # ──────────────────────────────────────────
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Lint
        run: pnpm turbo lint --filter='./apps/*' --filter='./packages/*'

      - name: Type check
        run: pnpm turbo typecheck --filter='./apps/*' --filter='./packages/*'

      - name: Test
        run: pnpm turbo test --filter='./apps/*' --filter='./packages/*'

  # ──────────────────────────────────────────
  # Backend: one uv project, three deployables
  # ──────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://bhojango:bhojango_test@localhost:5432/bhojango_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: test_jwt_secret_for_ci_minimum_32_characters
      APP_ENV: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # realtime and worker each have an `app` package, so they run separately.
      - name: Test core_api
        run: uv run pytest core_api -v --tb=short
      - name: Test realtime
        run: uv run pytest realtime -v --tb=short
      - name: Test worker
        run: uv run pytest worker -v --tb=short

  # ──────────────────────────────────────────
  # Migrations (+ alembic check, API on a migrated DB) and Docker builds.
  # Shared with pr-checks.yml via a reusable workflow.
  # ──────────────────────────────────────────
  backend-checks:
    name: Backend checks
    needs: [frontend, backend-test]
    uses: ./.github/workflows/backend-checks.yml

  # ──────────────────────────────────────────
  # Deploy to staging (GitHub OIDC; skipped until AWS is connected)
  # ──────────────────────────────────────────
  deploy-staging:
    name: Staging
    needs: [backend-checks]
    if: github.ref == 'refs/heads/dev' && vars.AWS_STAGING_DEPLOY_ROLE_ARN != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      github_environment: staging
      aws_role_arn: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
