name: CI/CD Pipeline

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: bhojango-prod-cluster

jobs:
  # ──────────────────────────────────────────
  # Frontend: lint + typecheck + build
  # ──────────────────────────────────────────
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'
        continue-on-error: true

      - name: Lint
        run: pnpm turbo lint --filter='./apps/*' --filter='./packages/*'
        continue-on-error: true

      - name: Type check
        run: pnpm turbo typecheck --filter='./apps/*' --filter='./packages/*'
        continue-on-error: true

  # ──────────────────────────────────────────
  # Backend: one uv project, three deployables
  # ──────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://bhojango:bhojango_test@localhost:5432/bhojango_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: test_jwt_secret_for_ci_minimum_32_characters
      APP_ENV: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # realtime and worker each have an `app` package, so they run separately.
      - name: Test core_api
        run: uv run pytest core_api -v --tb=short
      - name: Test realtime
        run: uv run pytest realtime -v --tb=short
      - name: Test worker
        run: uv run pytest worker -v --tb=short

  # ──────────────────────────────────────────
  # Migrations: single history applies cleanly
  # ──────────────────────────────────────────
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bhojango
          POSTGRES_PASSWORD: bhojango_test
          POSTGRES_DB: bhojango_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bhojango"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://bhojango:bhojango_test@localhost:5432/bhojango_test
      JWT_SECRET: test_jwt_secret_for_ci_minimum_32_characters
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Create schemas and extensions
        run: psql "postgresql://bhojango:bhojango_test@localhost:5432/bhojango_test" -f infra/docker/db/init.sql

      - name: Upgrade, downgrade, upgrade
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  # ──────────────────────────────────────────
  # Docker build check (no push without AWS)
  # ──────────────────────────────────────────
  docker-build:
    name: Docker Build ${{ matrix.image }}
    needs: [frontend, backend-test, migrations]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - core_api
          - realtime
          - worker
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f backend/${{ matrix.image }}/Dockerfile -t bhojango-${{ matrix.image }}:test backend

  # ──────────────────────────────────────────
  # Deploy to ECS (only when AWS secrets exist)
  # ──────────────────────────────────────────
  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [docker-build]
    if: ${{ secrets.AWS_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        # ECS services/ECR repos for these three are created when P4 trims
        # infra/terraform; until then this job has nothing to deploy to.
        include:
          - image: core_api
            service: core-api
          - image: realtime
            service: realtime
          - image: worker
            service: worker

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/bhojango-prod/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/bhojango-prod/${{ matrix.service }}:latest

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service bhojango-prod-${{ matrix.service }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
