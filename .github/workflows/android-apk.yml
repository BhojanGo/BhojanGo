name: Android APK

# Debug APKs of the Expo apps, built the way `make apk APP=<app>` builds them on a
# laptop: tools/android/build-apk.sh inside reactnativecommunity/react-native-android.
# A debug APK loads its JavaScript from Metro on the developer's computer
# (`pnpm --filter @bhojango/<app> start`, adb reverse tcp:8081), so it only needs
# rebuilding when native code changes. Run it from the Actions tab; each APK is an
# artifact for 7 days. The repo is public, so the minutes are free.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [all, customer, rider, partner]
        default: all
      arch:
        description: CPU (x86_64 for the emulator, arm64-v8a for a phone)
        type: choice
        options: [x86_64, arm64-v8a]
        default: x86_64

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}-${{ inputs.app }}-${{ inputs.arch }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (${{ matrix.app }}, ${{ inputs.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.app == 'all' && '["customer","rider","partner"]' || format('["{0}"]', inputs.app)) }}
    env:
      APP: ${{ matrix.app }}
      ARCH: ${{ inputs.arch }}
      IMAGE: reactnativecommunity/react-native-android:v22.0
    steps:
      - uses: actions/checkout@v4

      # The Android image and a Gradle build need more room than the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build the debug APK (tools/android/build-apk.sh)
        run: |
          mkdir -p .apk
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$GITHUB_WORKSPACE/.apk:/out" \
            -e ARCH="$ARCH" \
            "$IMAGE" sh /src/tools/android/build-apk.sh "$APP"
          ls -la .apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-${{ inputs.arch }}
          path: .apk/${{ matrix.app }}-debug.apk
          if-no-files-found: error
          retention-days: 7
