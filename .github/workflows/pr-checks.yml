name: PR Checks

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # Detect changed paths for targeted checks
  # ──────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/**'
              - 'packages/**'
            backend:
              - 'backend/**'
              - 'infra/docker/db/**'
            infra:
              - 'infra/**'
            terraform:
              - 'infra/terraform/**'

  # ──────────────────────────────────────────
  # Frontend checks
  # ──────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
      - run: pnpm turbo build --filter='./packages/*'
      - run: pnpm turbo lint --filter='./apps/*' --filter='./packages/*'
      - run: pnpm turbo typecheck --filter='./apps/*' --filter='./packages/*'
      - run: pnpm turbo test --filter='./apps/*' --filter='./packages/*'

  # ──────────────────────────────────────────
  # Backend tests
  # ──────────────────────────────────────────
  backend-test:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://bhojango:bhojango_test@localhost:5432/bhojango_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: test_jwt_secret_for_ci_minimum_32_characters
      APP_ENV: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true

      - run: uv sync --frozen
      # realtime and worker each have an `app` package, so they run separately.
      - run: uv run pytest core_api -v --tb=short
      - run: uv run pytest realtime -v --tb=short
      - run: uv run pytest worker -v --tb=short

  # ──────────────────────────────────────────
  # Migrations + Docker builds (same jobs as ci.yml on dev)
  # ──────────────────────────────────────────
  backend-checks:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/backend-checks.yml

  # ──────────────────────────────────────────
  # Terraform validation
  # ──────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8"

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  # ──────────────────────────────────────────
  # Status check gate
  # ──────────────────────────────────────────
  pr-status:
    name: PR Status
    if: always()
    needs: [frontend-lint, backend-test, backend-checks, terraform-validate]
    runs-on: ubuntu-latest
    steps:
      # Skipped jobs (no matching changes) are fine; failed or cancelled ones are not.
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required check did not pass"; exit 1
            fi
          done
          echo "All checks passed or were skipped"
