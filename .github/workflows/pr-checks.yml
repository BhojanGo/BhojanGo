name: PR Checks

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  id-token: write   # terraform plan assumes the read-only plan role via GitHub OIDC

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # Detect changed paths for targeted checks
  # ──────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/**'
              - 'packages/**'
            backend:
              - 'backend/**'
              - 'infra/docker/db/**'
            infra:
              - 'infra/**'
            terraform:
              - 'infra/terraform/**'

  # ──────────────────────────────────────────
  # Frontend checks
  # ──────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm turbo build --filter='./packages/*'
      - run: pnpm turbo lint --filter='./apps/*' --filter='./packages/*'
      - run: pnpm turbo typecheck --filter='./apps/*' --filter='./packages/*'
      - run: pnpm turbo test --filter='./apps/*' --filter='./packages/*'

  # ──────────────────────────────────────────
  # Backend tests
  # ──────────────────────────────────────────
  backend-test:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://bhojango:bhojango_test@localhost:5432/bhojango_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: test_jwt_secret_for_ci_minimum_32_characters
      APP_ENV: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true

      - run: uv sync --frozen
      # realtime and worker each have an `app` package, so they run separately.
      - run: uv run pytest core_api -v --tb=short
      - run: uv run pytest realtime -v --tb=short
      - run: uv run pytest worker -v --tb=short

  # ──────────────────────────────────────────
  # Migrations + Docker builds (same jobs as ci.yml on dev)
  # ──────────────────────────────────────────
  backend-checks:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/backend-checks.yml

  # ──────────────────────────────────────────
  # Terraform validation
  # ──────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -recursive -check -diff

      - name: terraform validate (envs/staging, envs/prod, bootstrap)
        working-directory: infra/terraform
        run: |
          for dir in envs/staging envs/prod bootstrap; do
            echo "::group::${dir}"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # Plans only when AWS is connected (the read-only plan role variable exists);
  # otherwise these jobs are skipped, not failed.
  terraform-plan:
    name: Terraform Plan (${{ matrix.environment }})
    needs: [changes, terraform-validate]
    if: needs.changes.outputs.terraform == 'true' && (vars.AWS_STAGING_PLAN_ROLE_ARN != '' || vars.AWS_PROD_PLAN_ROLE_ARN != '')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            role: AWS_STAGING_PLAN_ROLE_ARN
            bucket: STAGING_TF_STATE_BUCKET
          - environment: prod
            role: AWS_PROD_PLAN_ROLE_ARN
            bucket: PROD_TF_STATE_BUCKET
    env:
      ROLE: ${{ vars[matrix.role] }}
      STATE_BUCKET: ${{ vars[matrix.bucket] }}
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this environment isn't connected
        id: connected
        working-directory: .
        run: echo "ok=$([ -n "$ROLE" ] && [ -n "$STATE_BUCKET" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.connected.outputs.ok == 'true'
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        if: steps.connected.outputs.ok == 'true'
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: terraform plan
        if: steps.connected.outputs.ok == 'true'
        run: |
          terraform init -input=false -backend-config=backend.hcl -backend-config="bucket=${STATE_BUCKET}"
          terraform plan -input=false -no-color -lock-timeout=5m | tee plan.txt
          {
            echo "### Terraform plan: ${{ matrix.environment }}"
            echo '```'
            grep -E "^Plan:|^No changes" plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────
  # Status check gate
  # ──────────────────────────────────────────
  pr-status:
    name: PR Status
    if: always()
    needs: [frontend-lint, backend-test, backend-checks, terraform-validate, terraform-plan]
    runs-on: ubuntu-latest
    steps:
      # Skipped jobs (no matching changes) are fine; failed or cancelled ones are not.
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required check did not pass"; exit 1
            fi
          done
          echo "All checks passed or were skipped"
