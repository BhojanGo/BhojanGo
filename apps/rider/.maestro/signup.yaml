# Sign up to ride with a brand-new number: name and city, then the onboarding checklist.
appId: com.bhojango.rider
---
- runScript: scripts/new_phone.js
- runFlow:
    file: sign-in.yaml
    env:
      PHONE: ${output.phone}
      INDIA: "true"
- extendedWaitUntil:
    visible: "Sign up to deliver"
    timeout: 30000
- tapOn:
    id: "name"
- inputText: "Kiran Rao"
- hideKeyboard
- tapOn: "Hyderabad"
# the date of birth (18+) and the vehicle (R20); Continue is below them
- scrollUntilVisible:
    element:
      id: "dob-day"
    direction: DOWN
- tapOn:
    id: "dob-day"
- inputText: "14"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "dob-month"
    direction: DOWN
- tapOn:
    id: "dob-month"
- inputText: "06"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "dob-year"
    direction: DOWN
- tapOn:
    id: "dob-year"
- inputText: "1995"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "vehicle-motorcycle"
    direction: DOWN
- tapOn:
    id: "vehicle-motorcycle"
- takeScreenshot: docs/screenshots/rider/14-signup
- scrollUntilVisible:
    element:
      id: "join-continue"
    direction: DOWN
- tapOn:
    id: "join-continue"
- extendedWaitUntil:
    visible: "Almost ready to deliver, Kiran"
    timeout: 30000
- assertVisible: "1 of 5"
- takeScreenshot: docs/screenshots/rider/15-signup-checklist
