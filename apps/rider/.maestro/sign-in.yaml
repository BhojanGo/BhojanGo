# Sign in with a rider's phone and the code (seed phones always get 123456).
# PHONE: 10 digits; INDIA=true (or COUNTRY=IN) picks India's country code, else the US.
appId: com.bhojango.rider
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# A cold start with cleared state (fonts, Markets) can take over a minute on an emulator.
- extendedWaitUntil:
    visible: "Deliver on your.*"
    timeout: 120000
- takeScreenshot: docs/screenshots/rider/01-sign-in
# The phone's country starts from the device's region (Markets countries); step to
# ${INDIA == "true" ? "IN" : (COUNTRY || "US")} (INDIA=true or COUNTRY=<code>; the US by default).
- repeat:
    while:
      notVisible:
        id: 'phone-country-${INDIA == "true" ? "IN" : (COUNTRY || "US")}'
    times: 6
    commands:
      - tapOn:
          id: "phone-country-.*"
- tapOn:
    id: "phone"
- inputText: ${PHONE || "9000000201"}
- hideKeyboard
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter the 6-digit code"
    timeout: 15000
- takeScreenshot: docs/screenshots/rider/02-code
- inputText: "123456"
- extendedWaitUntil:
    notVisible: "Enter the 6-digit code"
    timeout: 30000
