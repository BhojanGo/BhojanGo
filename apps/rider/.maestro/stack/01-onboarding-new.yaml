# RiderOnboarding.html, as a brand-new rider sees it: sign up with a new number (name, city,
# date of birth and vehicle from India's Markets rules), then the onboarding checklist. Creates an account, so throwaway stack only
# (.github/workflows/app-screens.yml).
appId: com.bhojango.rider
---
- runScript: ../scripts/new_phone.js
- runFlow:
    file: ../sign-in.yaml
    env:
      PHONE: ${output.phone}
      INDIA: "true"
- extendedWaitUntil:
    visible: "Sign up to deliver"
    timeout: 60000
- tapOn:
    id: "name"
- inputText: "Kiran Rao"
- hideKeyboard
- tapOn: "Hyderabad"
- extendedWaitUntil:
    visible:
      id: "dob-year"
    timeout: 30000
- tapOn:
    id: "dob-day"
- inputText: "15"
- hideKeyboard  # the number pad covers the next field (R18)
- tapOn:
    id: "dob-month"
- inputText: "6"
- hideKeyboard  # the number pad covers the next field (R18)
- tapOn:
    id: "dob-year"
- inputText: "1995"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "vehicle-motorcycle"
- tapOn:
    id: "vehicle-motorcycle"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: stack-rider-signup
- tapOn:
    id: "join-continue"
- extendedWaitUntil:
    visible: "Almost ready to deliver, Kiran"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: stack-rider-onboarding-new
