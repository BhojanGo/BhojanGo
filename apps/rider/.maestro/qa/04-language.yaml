# QA, read-only: Account shows the rider's country's languages (Markets locales:
# India's seven); picking Hindi changes the words at once, English brings them back.
# The language is kept on this phone only. Never taps "Sign out" (it signs the demo
# rider out everywhere).
appId: com.bhojango.rider
---
- runFlow: common/sign-in-demo.yaml
- tapOn:
    id: "tab-account"
- extendedWaitUntil:
    visible:
      id: "account-title"
    timeout: 10000
- assertVisible: "Account"
- scrollUntilVisible:
    element:
      id: "language-en"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "language-hi"
- takeScreenshot: docs/screenshots/rider/qa/04-account-languages
- tapOn:
    id: "language-hi"
# The tab bar and the screen switch to Hindi.
- extendedWaitUntil:
    visible: "खाता"
    timeout: 10000
- assertVisible: "भाषा"
- assertNotVisible: "Documents"
- takeScreenshot: docs/screenshots/rider/qa/04-account-hindi
- tapOn:
    id: "tab-earnings"
- extendedWaitUntil:
    visible: "कमाई"
    timeout: 20000
- takeScreenshot: docs/screenshots/rider/qa/04-earnings-hindi
- tapOn:
    id: "tab-account"
# Account may come back scrolled past the list or above it: look both ways.
- scrollUntilVisible:
    element:
      id: "language-en"
    direction: DOWN
    timeout: 10000
    optional: true
- scrollUntilVisible:
    element:
      id: "language-en"
    direction: UP
    timeout: 10000
    optional: true
- tapOn:
    id: "language-en"
- extendedWaitUntil:
    visible: "Language"
    timeout: 10000
# Back in English; the page may be scrolled down to the language list.
- scrollUntilVisible:
    element: "Documents"
    direction: UP
    timeout: 20000
# Round 6: the same through the language pill in the Drive top bar (globe + "EN"):
# a plain list under the pill, each language in its own script, kept on this phone.
- tapOn:
    id: "tab-drive"
- extendedWaitUntil:
    visible:
      id: "language-pill"
    timeout: 20000
- assertVisible:
    id: "language-pill-code"
    text: "EN"
- tapOn:
    id: "language-pill"
- extendedWaitUntil:
    visible:
      id: "language-menu"
    timeout: 5000
- assertVisible: "हिन्दी"
- assertVisible: "తెలుగు"
- takeScreenshot: docs/screenshots/rider/qa/04-pill-list
- tapOn:
    id: "language-option-hi"
- extendedWaitUntil:
    visible: "खाता"
    timeout: 10000
- assertVisible:
    id: "language-pill-code"
    text: "HI"
- tapOn:
    id: "language-pill"
- extendedWaitUntil:
    visible:
      id: "language-menu"
    timeout: 5000
- tapOn:
    id: "language-option-en"
- extendedWaitUntil:
    visible:
      id: "language-pill-code"
      text: "EN"
    timeout: 10000
