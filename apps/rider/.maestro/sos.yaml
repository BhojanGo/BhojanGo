# Safety: SOS from Account; alert the safety team (stored, shown to dispatch admins).
appId: com.bhojango.rider
env:
  PHONE: "9000000202"
  INDIA: "true"
---
- runFlow: sign-in.yaml
- extendedWaitUntil:
    visible: "You're offline"
    timeout: 30000
- tapOn: "Account"
# the language list sits above Sign out on a phone: scroll to it (R31)
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
    timeout: 30000
- takeScreenshot: docs/screenshots/rider/11-account
# R34: scroll UP to the Payouts row, not just to Safety. Payouts sits directly above Safety, so a scroll that
# stopped as soon as Safety showed left Payouts above the screen on some swipes, and the Payouts tap after
# Close failed (2 of 3 runs in R33). Rows are tapped by id, never by a word that can appear elsewhere.
- scrollUntilVisible:
    element:
      id: "account-payouts"
    direction: UP
    timeout: 20000
- assertVisible:
    id: "account-safety"
- tapOn:
    id: "account-safety"
- extendedWaitUntil:
    visible: "Get help now"
    timeout: 10000
- assertVisible: "Call 112"
- tapOn: "Alert BhojanGo safety team"
- extendedWaitUntil:
    visible: "The safety team has your alert.*"
    timeout: 45000  # the app takes a location fix first (slow on an emulator)
- takeScreenshot: docs/screenshots/rider/12-sos
- tapOn:
    id: "sos-close"
# back on Account; the scroll position is kept, but bring Payouts into view again rather than assume it
- extendedWaitUntil:
    visible:
      id: "account-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "account-payouts"
    direction: UP
    timeout: 20000
- tapOn:
    id: "account-payouts"
- extendedWaitUntil:
    visible: "Past weeks"
    timeout: 15000
- takeScreenshot: docs/screenshots/rider/13-payouts
