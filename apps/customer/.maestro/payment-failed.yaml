# A declined payment: not charged, price held, try again and it goes through.
appId: com.bhojango.app
---
- runFlow: sign-in.yaml
# Home lists the kitchens below Order again, the cuisines and the offers: scroll to the card.
# R31: an earlier flow's order adds "Order again" above the list: scroll to it rather than expect it on screen
- scrollUntilVisible:
    element:
      id: "kitchens"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "kitchen-card-spice-route-kitchen-madhapur"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "kitchen-card-spice-route-kitchen-madhapur"
- scrollUntilVisible:  # R33: wherever the menu lists it
    element:
      text: "Chicken Dum Biryani"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element: "Paneer Tikka"
- tapOn: "Paneer Tikka"
- tapOn:
    id: "add-to-bag"
- tapOn:
    text: "View cart.*"
- extendedWaitUntil:
    visible: "The fair bill"
    timeout: 20000
- tapOn:
    text: "Pay .*"
- tapOn: "Decline"
- extendedWaitUntil:
    visible: "Payment didn't go through"
    timeout: 30000
- assertVisible:
    text: ".*You have not been charged.*"
- assertVisible: "Your price is still held"
- takeScreenshot: docs/screenshots/customer/08-payment-failed
- tapOn: "Try UPI again"
- tapOn:
    text: "Approve.*"
- extendedWaitUntil:
    visible: "Spice Route Kitchen has your order"
    timeout: 30000
