# Account: the delete confirmation opens and is cancelled (deleting is tested
# against a throwaway account by the API suite), then sign out and back in.
appId: com.bhojango.app
---
- runFlow: sign-in.yaml
- tapOn: "Account"
- extendedWaitUntil:
    visible:
      id: "account-screen"
    timeout: 20000
- takeScreenshot: docs/screenshots/customer/10-account
- scrollUntilVisible:
    element:
      id: "account-privacy"
- tapOn:
    id: "account-privacy"
- tapOn:
    id: "delete-account"
- assertVisible: "Delete your account?"
- tapOn: "Keep my account"
- assertNotVisible: "Delete your account?"
- tapOn:
    id: "back"
- scrollUntilVisible:
    element:
      id: "sign-out"
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible: "Sign in or create an account"
    timeout: 15000
