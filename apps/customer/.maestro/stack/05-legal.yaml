# R20: the sign-in's Terms and Privacy policy line (now mobile-core's SignInLegal, as in the
# Kitchen and Delivery apps), and the Account tab's Legal section (Privacy policy, Terms
# of use: the country's pages on the website). Reads only.
# Throwaway stack only (.github/workflows/app-screens.yml).
appId: com.bhojango.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in or create an account"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "signin-legal"
# The links are parts of one line of text (Android exposes no separate element for them): check the words.
- assertVisible:
    id: "signin-legal"
    text: ".*Terms.*Privacy policy.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: stack-customer-sign-in-legal
- runFlow:
    file: common/sign-in.yaml
    env:
      CODE_SHOT: "true"
- extendedWaitUntil:
    visible:
      id: "tab-account"
    timeout: 60000
- tapOn:
    id: "tab-account"
- extendedWaitUntil:
    visible:
      id: "account-screen"
    timeout: 20000
# R22: the mobile number in its country's format, not "+919000000101".
- assertVisible: '\+91 90000 00101'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: stack-customer-account-phone
- scrollUntilVisible:
    element:
      id: "account-legal"
    centerElement: true
- assertVisible:
    id: "legal-privacy"
- assertVisible:
    id: "legal-terms"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: stack-customer-account-legal
