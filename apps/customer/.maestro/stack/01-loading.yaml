# CustomerLoading.html: home while the kitchens load. The app talks to the core API
# through tools/mobile/slow_proxy.py, which holds GET /discover until we let it go.
# Throwaway stack only (.github/workflows/app-screens.yml); never on QA.
# R23: no timer in the hold. The request waits at the proxy until release.js lets it go
# (and release.js fails if it isn't still waiting); the app's 8 s GET timeout is lifted
# on this stack only (EXPO_PUBLIC_TEST_GET_TIMEOUT_MS), so a slow emulator can't turn the
# loading state into the error state before the release (R22's one failure).
appId: com.bhojango.app
---
- runScript: scripts/hold.js
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible:
      text: "Finding kitchens near.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: stack-customer-loading
- runScript: scripts/release.js
# The list sits below the offers now (R18): scroll down to it.
- scrollUntilVisible:
    element:
      id: "kitchens"
    timeout: 60000
# Round 20: the home's location line for a live city, "<City>, <ST> · Change" (the state's short code).
- scrollUntilVisible:
    element:
      id: "location-line"
    direction: UP
    timeout: 20000
- assertVisible:
    id: "location-city"
    text: ".*, [A-Z0-9]{1,4}"
- assertVisible:
    id: "change-city"  # its accessible name is "Change city"; it reads "Change"
- takeScreenshot: stack-customer-home-location-line
