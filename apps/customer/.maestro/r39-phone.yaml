    file: r39/typing.yaml
    env:
      MARKET: "us"
      COUNTRY: "US"
      OTHER: "IN"
      D1: "2"
      D2: "0"
      D3: "8"
      D4: "5"
      D5: "5"
      D6: "5"
      D7: "0"
      D8: "1"
      D9: "2"
      D10: "3"
      S1: '2'
      S2: '20'
      S3: '\(208\)'
      S4: '\(208\) 5'
      S5: '\(208\) 55'
      S6: '\(208\) 555'
      S7: '\(208\) 555-0'
      S8: '\(208\) 555-01'
      S9: '\(208\) 555-012'
      S10: '\(208\) 555-0123'
      SWITCHED: '20 8555 0123'
