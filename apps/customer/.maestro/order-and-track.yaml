# The main path: a kitchen near you, customise a dish, the fair bill, pay, live tracking.
appId: com.bhojango.app
---
- runFlow: sign-in.yaml
# Home lists the kitchens below Order again, the cuisines and the offers: scroll to the card.
# R31: an earlier flow's order adds "Order again" above the list: scroll to it rather than expect it on screen
- scrollUntilVisible:
    element:
      id: "kitchens"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "kitchen-card-spice-route-kitchen-madhapur"
    direction: DOWN
    timeout: 30000
- takeScreenshot: docs/screenshots/customer/03-home
- tapOn:
    id: "kitchen-card-spice-route-kitchen-madhapur"
- scrollUntilVisible:  # R33: wherever the menu lists it
    element:
      text: "Chicken Dum Biryani"
    direction: DOWN
    timeout: 30000
- takeScreenshot: docs/screenshots/customer/04-restaurant
- tapOn: "Chicken Dum Biryani"
- assertVisible: "Size"
- tapOn: "Extra raita"
- takeScreenshot: docs/screenshots/customer/05-customise
- tapOn:
    id: "add-to-bag"
- tapOn:
    text: "View cart.*"
- extendedWaitUntil:
    visible: "The fair bill"
    timeout: 20000
# R32: Spice Route takes pickup orders, so "How do you want it?" sits above the bill: scroll to its tax line
- scrollUntilVisible:
    element:
      text: "Government"  # the tax line's payee (R38; was "Tax", before R8 "GOVT")
    direction: DOWN
    timeout: 10000
- assertVisible: "RESTAURANT"
- takeScreenshot: docs/screenshots/customer/06-bag-fair-bill
- tapOn:
    text: "Pay .*"
- tapOn:
    text: "Approve.*"
- extendedWaitUntil:
    visible: "Spice Route Kitchen has your order"
    timeout: 30000
- assertVisible:
    id: "eta"
# The 4-digit PIN the rider asks for at the door (P18) shows only once the rider
# has picked the order up (R27), not while the kitchen has it.
- assertNotVisible:
    id: "delivery-pin"
- takeScreenshot: docs/screenshots/customer/07-tracking
