# READ-ONLY (safe on QA): the header's language pill and the home's location line
# (round 6). Sign in as the demo customer whose address is in an Indian city (demo1,
# +91 90000 00301): the pill shows EN; its list is the country's seven languages,
# each in its own script, no flags; picking Telugu switches the words and the pill
# to TE; English brings them back. The pill keeps the language on this phone only
# (it never saves preferred_locale on the account: only Account > Language does),
# so nothing is written. The location line reads "<City>, <ST> · Change" (the state's short code, round 20).
# CITY: the demo city's name as Markets shows it (default: the seed's first Indian city).
appId: com.bhojango.app
tags:
  - qa-readonly
---
- runFlow:
    file: sign-in.yaml
    env:
      PHONE: ${PHONE || "9000000301"}
- extendedWaitUntil:
    visible:
      id: "home"
    timeout: 60000
# English by default (sign-in.yaml clears the app's state).
- assertVisible:
    id: "language-pill"
    text: "Language: English"
- assertVisible:
    id: "language-pill-code"
    text: "EN"
# The location line: the delivery address's live city and its state's short code (round 20).
- extendedWaitUntil:
    visible:
      id: "location-city"
      text: '${CITY || "Hyderabad"}, ${STATE || "TG"}'
    timeout: 30000
- assertVisible:
    id: "change-city"
- takeScreenshot: docs/screenshots/customer/qa/language-01-home
- tapOn:
    id: "language-pill"
- extendedWaitUntil:
    visible:
      id: "language-menu"
    timeout: 5000
# India's seven languages, each named in its own script.
- assertVisible: "English"
- assertVisible: "हिन्दी"
- assertVisible: "తెలుగు"
- assertVisible: "தமிழ்"
- assertVisible: "ಕನ್ನಡ"
- assertVisible: "मराठी"
- assertVisible: "বাংলা"
- assertNotVisible: "Español"
# No flags (regional-indicator emoji) anywhere in the list.
- assertNotVisible: ".*[🇦-🇿].*"
- takeScreenshot: docs/screenshots/customer/qa/language-02-list
- tapOn:
    id: "language-option-te"
- extendedWaitUntil:
    notVisible:
      id: "language-menu"
    timeout: 20000
# Telugu words on the home screen, and the pill says TE.
- extendedWaitUntil:
    visible: "నగరం మార్చండి"
    timeout: 10000
- assertVisible:
    id: "language-pill-code"
    text: "TE"
- assertVisible:
    id: "language-pill"
    text: ".*తెలుగు.*"
- takeScreenshot: docs/screenshots/customer/qa/language-03-telugu
# Back to English.
- tapOn:
    id: "language-pill"
- extendedWaitUntil:
    visible:
      id: "language-menu"
    timeout: 5000
- tapOn:
    id: "language-option-en"
- extendedWaitUntil:
    visible:
      id: "change-city"
      text: "Change"
    timeout: 10000
- assertVisible:
    id: "language-pill-code"
    text: "EN"
