# The language page lists exactly the country's languages (Markets: the same list
# as the header's pill) and switching changes the words; then back to English.
# There is no country selector (the country follows the delivery address).
# Switching here also remembers the language
# on the account (PATCH /users/me preferred_locale) as the website does: run
# against a demo account. LANG2 is a second language of the account's country
# (default "hi" for the seed phones' country).
appId: com.bhojango.app
---
- runFlow: sign-in.yaml
- tapOn: "Account"
- scrollUntilVisible:
    element:
      id: "account-language"
- tapOn:
    id: "account-language"
- extendedWaitUntil:
    visible:
      id: "language-en"
    timeout: 20000
- assertVisible:
    id: "language-title"
    text: "Language"
- assertVisible:
    id: 'language-${LANG2 || "hi"}'
- assertNotVisible:
    id: "country-section"
- takeScreenshot: docs/screenshots/customer/45-language
- tapOn:
    id: 'language-${LANG2 || "hi"}'
- extendedWaitUntil:
    notVisible:
      id: "language-title"
      text: "Language"
    timeout: 5000
- assertVisible:
    id: "language-title"
- takeScreenshot: docs/screenshots/customer/46-language-switched
- tapOn:
    id: "language-en"
# R34: switching language restarts the app's screen; on an emulator with a dev build that takes over 5 s
- extendedWaitUntil:
    visible:
      id: "language-title"
      text: "Language"
    timeout: 20000
