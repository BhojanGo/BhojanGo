# R37: offers BhojanGo pays for are off in the seed, so the Hyderabad home card shows none; India's bill is to
# the paisa (the cart's item line stays whole: ₹340, the bill's Food line ₹340.00, Pay ₹x.xx).
appId: com.bhojango.app
---
- runFlow: sign-in.yaml
- scrollUntilVisible:
    element:
      id: "kitchens"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "kitchen-card-spice-route-kitchen-madhapur"
    direction: DOWN
    centerElement: true
    timeout: 30000
# the seeded launch offer ("10% off, up to ₹50") is BhojanGo's: paused, no budget, not on any card
- assertNotVisible:
    text: ".*10% off, up to.*"
- takeScreenshot: docs/screenshots/customer/r37-home-no-bhojango-offer
- tapOn:
    id: "kitchen-card-spice-route-kitchen-madhapur"
- scrollUntilVisible:
    element:
      text: "Chicken Dum Biryani"
    direction: DOWN
    timeout: 30000
- tapOn: "Chicken Dum Biryani"
- assertVisible: "Size"
- tapOn: "Extra raita"
- tapOn:
    id: "add-to-bag"
- tapOn:
    text: "View cart.*"
- extendedWaitUntil:
    visible: "The fair bill"
    timeout: 20000
- assertVisible: "₹340"          # the cart's item line: whole rupees
- scrollUntilVisible:
    element:
      text: "₹340.00"            # the bill's Food line: exact paise
    direction: DOWN
    timeout: 10000
- assertNotVisible:
    text: ".*10% off.*"
- scrollUntilVisible:
    element:
      text: "Government"  # R38: the tax line's payee
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "₹[0-9,]+\\.[0-9]{2}"
- takeScreenshot: docs/screenshots/customer/r37-hyderabad-bill
- scrollUntilVisible:
    element:
      text: "Pay ₹[0-9,]+\\.[0-9]{2}.*"
    direction: DOWN
    timeout: 10000
- takeScreenshot: docs/screenshots/customer/r37-hyderabad-pay
