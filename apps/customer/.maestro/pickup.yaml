# R32: order for pickup. The bag offers Delivery or Pickup (the restaurant takes pickup orders): pickup has no
# delivery fee and no tip, shows the restaurant's address with "Open in Maps"; once the restaurant marks it
# ready, the order screen shows the 4-digit pickup code; when the restaurant enters it, the order is collected.
# R33: the cart (not "bag"); the order's steps are Placed -> Preparing -> Ready for pickup -> Picked up (no Home).
# R34: never "Arriving": "Ready in about N min" until it's ready, then "Ready for pickup" with the address.
appId: com.bhojango.app
---
- runFlow: sign-in.yaml
- scrollUntilVisible:
    element:
      id: "kitchens"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "kitchen-card-spice-route-kitchen-madhapur"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "kitchen-card-spice-route-kitchen-madhapur"
- scrollUntilVisible:  # R33: wherever the menu lists it
    element:
      text: "Chicken Dum Biryani"
    direction: DOWN
    timeout: 30000
- tapOn: "Chicken Dum Biryani"
- assertVisible: "Size"
- tapOn:
    id: "add-to-bag"
- tapOn:
    text: "View cart.*"
- extendedWaitUntil:
    visible: "The fair bill"
    timeout: 20000
# Delivery first: the tip card (it goes to the delivery partner) is there
- assertVisible: "How do you want it\\?"
- assertVisible: "Tip your delivery partner.*"
- tapOn: "Pickup"
- extendedWaitUntil:
    visible:
      id: "pickup-at"
    timeout: 20000
- assertVisible: "Pick up at"
- assertVisible: "Spice Route Kitchen"
- assertVisible:
    id: "open-in-maps"
- extendedWaitUntil:
    notVisible: "Tip your delivery partner.*"
    timeout: 20000
- assertNotVisible: "Tip for your delivery partner"
- takeScreenshot: docs/screenshots/customer/20-pickup-bag
- scrollUntilVisible:
    element:
      text: "Platform fee"
    direction: DOWN
    timeout: 10000
- takeScreenshot: docs/screenshots/customer/21-pickup-bill
- tapOn:
    text: "Pay .*"
- tapOn:
    text: "Approve.*"
- extendedWaitUntil:
    visible:
      id: "pickup-card"
    timeout: 30000
- assertVisible: "Your pickup code shows here when your order is ready"
# R34: the countdown is to READY, not to an arrival
- assertVisible:
    id: "track-headline"
    text: "Ready in about"
- assertVisible:
    id: "eta"
    text: "[0-9]+ min"
- assertNotVisible: "Arriving.*"
- assertNotVisible:
    id: "pickup-ready-where"
- takeScreenshot: docs/screenshots/customer/21b-pickup-ready-in
- assertNotVisible:
    id: "pickup-code"
# R33: the pickup steps, no delivery steps
- extendedWaitUntil:
    visible:
      id: "pickup-steps"
    timeout: 20000
- assertVisible:
    id: "step-placed"
- assertVisible:
    id: "step-preparing"
- assertVisible:
    id: "step-ready"
- assertVisible:
    id: "step-collected"
- assertNotVisible:
    id: "step-home"
- assertNotVisible:
    id: "delivery-steps"
- assertNotVisible: "Home"
- runScript:
    file: scripts/pickup.js
    env:
      STEP: ready
- extendedWaitUntil:
    visible:
      id: "pickup-code"
    timeout: 30000
- assertVisible: "Show this code at the counter"
- assertVisible: "Ready for pickup"
# R34: ready: "Ready for pickup" in the big line with the restaurant and its address, no minutes
- assertVisible:
    id: "eta"
    text: "Ready for pickup"
- assertVisible:
    id: "pickup-ready-where"
    text: "Spice Route Kitchen, .+"
- assertNotVisible: "Ready in about"
- assertNotVisible: "Arriving.*"
- takeScreenshot: docs/screenshots/customer/22-pickup-code
- runScript:
    file: scripts/pickup.js
    env:
      STEP: hand
- extendedWaitUntil:
    notVisible:
      id: "pickup-code"
    timeout: 30000
- assertVisible:
    id: "step-collected"
- assertVisible: "Picked up.*"
- assertVisible:
    id: "eta"
    text: "Picked up"
- assertNotVisible:
    id: "step-home"
- takeScreenshot: docs/screenshots/customer/23-pickup-steps-collected
