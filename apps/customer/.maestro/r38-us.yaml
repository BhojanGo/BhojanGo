# R38 as a US customer in Boise: +1, "(208) 555-0123", never +91; the bill with the Idaho sales tax line.
appId: com.bhojango.app
---
- runFlow:
    file: r38/bill-and-phone.yaml
    env:
      MARKET: "us"
      LAT: "43.6400"
      LNG: "-116.2100"
      COUNTRY: "US"
      PHONE: "2085550101"
      EXAMPLE_RE: "\+1 \(208\) 555-0123"
      OTHER_RE: ".*\+91.*"
      KITCHEN: "boise-bowl-co-hyde-park"
      DISH: "Teriyaki Chicken Bowl"
      TAX_RE: ".*sales tax.*"
