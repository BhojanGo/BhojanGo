# Sign in with the kitchen's phone (a tablet turns freely, a phone runs portrait); seed phones get 123456.
# The Kitchen app opens on the Email tab (round 8): this flow picks Phone; sign-in-email.yaml does Email.
appId: com.bhojango.partner
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# A cold start with cleared state (the first bundle from Metro, fonts, Markets) can take over a minute on an emulator.
- extendedWaitUntil:
    visible: "Sign in to your restaurant"
    timeout: 120000
- takeScreenshot: docs/screenshots/partner/01-sign-in
- tapOn:
    id: "way-phone"
# The phone's country starts from the device's region (Markets countries); step to
# ${COUNTRY || "IN"} (the seed phones are Indian unless COUNTRY says otherwise).
- repeat:
    while:
      notVisible:
        id: 'phone-country-${COUNTRY || "IN"}'
    times: 6
    commands:
      - tapOn:
          id: "phone-country-.*"
- tapOn:
    id: "phone"
- inputText: ${PHONE || "9000000900"}
- hideKeyboard
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter the 6-digit code"
    timeout: 15000
- inputText: "123456"
- extendedWaitUntil:
    notVisible: "Enter the 6-digit code"
    timeout: 30000
