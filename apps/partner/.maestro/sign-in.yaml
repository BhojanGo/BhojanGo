# Sign in with the kitchen's phone (a tablet runs landscape, a phone portrait); seed phones get 123456.
appId: com.bhojango.partner
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in to your kitchen"
    timeout: 60000
- takeScreenshot: docs/screenshots/partner/01-sign-in
# The phone's country starts from the device's region (Markets countries); step to
# ${COUNTRY || "IN"} (the seed phones are Indian unless COUNTRY says otherwise).
- repeat:
    while:
      notVisible:
        id: 'phone-country-${COUNTRY || "IN"}'
    times: 6
    commands:
      - tapOn:
          id: "phone-country-.*"
- tapOn:
    id: "phone"
- inputText: ${PHONE || "9000000900"}
- hideKeyboard
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter the 6-digit code"
    timeout: 15000
- inputText: "123456"
- extendedWaitUntil:
    notVisible: "Enter the 6-digit code"
    timeout: 30000
