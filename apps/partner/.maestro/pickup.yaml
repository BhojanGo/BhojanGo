# R32: a customer pickup order on the tablet. Pickup on/off from the header; the order rings as usual and
# says "Customer pickup"; once ready it waits for the customer: the restaurant enters the customer's 4-digit
# code (a wrong one is refused) and hands it over. No delivery partner is involved.
appId: com.bhojango.partner
---
- runFlow: sign-in.yaml
- extendedWaitUntil:
    visible: "Which restaurant is this tablet for?"
    timeout: 30000
- tapOn: "Spice Route Kitchen"
- extendedWaitUntil:
    visible: "Ready for pickup"
    timeout: 30000
# the restaurant turns pickup off and on again
- extendedWaitUntil:
    visible:
      id: "pickup-toggle"
    timeout: 20000
- assertVisible: "Pickup on"
- tapOn:
    id: "pickup-toggle"
- extendedWaitUntil:
    visible: "Pickup off"
    timeout: 10000
- tapOn:
    id: "pickup-toggle"
- extendedWaitUntil:
    visible: "Pickup on"
    timeout: 10000
- runScript:
    file: scripts/pickup_order.js
    env:
      STEP: order
- extendedWaitUntil:
    visible: "(?i)to accept"
    timeout: 30000
- assertVisible:
    id: "pickup-badge"
- tapOn:
    id: "accept"
- extendedWaitUntil:
    visible: "Mark ready"
    timeout: 20000
- tapOn: "Mark ready"
- extendedWaitUntil:
    visible:
      id: "pickup-code-input"
    timeout: 20000
- assertVisible: "Enter the customer's pickup code"
- takeScreenshot: docs/screenshots/partner/20-ready-for-pickup
- runScript:
    file: scripts/pickup_order.js
    env:
      STEP: code
# a wrong code is refused
- tapOn:
    id: "pickup-code-input"
- inputText: ${output.wrongCode}
- hideKeyboard
- tapOn:
    id: "pickup-hand-over"
- extendedWaitUntil:
    visible: "That code doesn't match. Check it with the customer."
    timeout: 10000
- takeScreenshot: docs/screenshots/partner/21-pickup-code-wrong
# the customer's code completes it
- tapOn:
    id: "pickup-code-input"
- inputText: ${output.pickupCode}
- hideKeyboard
- takeScreenshot: docs/screenshots/partner/22-pickup-code-entry
- tapOn:
    id: "pickup-hand-over"
- extendedWaitUntil:
    notVisible:
      id: "pickup-code-input"
    timeout: 20000
