_format_version: "3.0"
_transform: true

# ── JWT Consumer & Credentials ───────────────
consumers:
  - username: bhojango-services
    jwt_secrets:
      - key: bhojango
        algorithm: HS256
        # No insecure fallback: Kong fails to load if JWT_SECRET is unset (must match user-svc's signing secret).
        secret: "${JWT_SECRET}"

services:
  # ── User Service ───────────────────────────
  - name: user-svc
    url: http://user-svc:8001
    routes:
      - name: user-auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
      - name: user-routes
        paths:
          - /api/v1/users
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  # ── Restaurant Service ─────────────────────
  - name: restaurant-svc
    url: http://restaurant-svc:8002
    routes:
      - name: restaurant-routes
        paths:
          - /api/v1/restaurants
        strip_path: false
      - name: search-routes
        paths:
          - /api/v1/search
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  # ── Order Service ──────────────────────────
  - name: order-svc
    url: http://order-svc:8003
    routes:
      - name: order-routes
        paths:
          - /api/v1/orders
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  # ── Delivery Service ───────────────────────
  - name: delivery-svc
    url: http://delivery-svc:8004
    routes:
      - name: delivery-routes
        paths:
          - /api/v1/delivery
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
      - name: delivery-ws
        paths:
          - /ws
        strip_path: false
        protocols:
          - http
          - https
          - ws
          - wss

  # ── Payment Service ────────────────────────
  - name: payment-svc
    url: http://payment-svc:8005
    routes:
      - name: payment-routes
        paths:
          - /api/v1/payments
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
      - name: wallet-routes
        paths:
          - /api/v1/wallet
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local

  # ── Notification Service ───────────────────
  - name: notification-svc
    url: http://notification-svc:8006
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp

  # ── Batch Engine ───────────────────────────
  - name: batch-engine
    url: http://batch-engine:8007
    routes:
      - name: batch-routes
        paths:
          - /api/v1/batch
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local

# ── Global Plugins ───────────────────────────
plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:3001"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
        - X-Idempotency-Key
      credentials: true
      max_age: 3600

  - name: request-id
    config:
      header_name: X-Request-ID
      generator: uuid

  - name: file-log
    config:
      path: /dev/stdout
      reopen: true
