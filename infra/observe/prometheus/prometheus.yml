# P23: Prometheus for `make observe`. Scrapes every service's /metrics (HTTP
# metrics, and core_api's pilot KPIs) and evaluates the alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: core-api
    static_configs: [{ targets: ["core-api:8001"], labels: { service: core-api } }]
  - job_name: realtime
    static_configs: [{ targets: ["realtime:8004"], labels: { service: realtime } }]
  - job_name: worker
    static_configs: [{ targets: ["worker:8006"], labels: { service: worker } }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"], labels: { service: otel-collector } }]
