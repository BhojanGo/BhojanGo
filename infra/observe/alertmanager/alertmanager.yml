# P23: no paging service (zero spend). Alerts go to core_api, which shows them
# in the admin console and logs them.
route:
  receiver: bhojango-console
  group_by: [alertname, city]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: bhojango-console
    webhook_configs:
      - url: http://core-api:8001/api/v1/ops/alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: local-observe-token
