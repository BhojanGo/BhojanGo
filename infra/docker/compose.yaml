# BhojanGo local stack.
#
#   docker compose up                       infra only: Postgres, PgBouncer, Redis,
#                                           LocalStack, Kong (same as before P1)
#   docker compose --profile backend up     infra + the 3 backend images
#   docker compose --profile all up         same as backend (everything)
#
# The repo-root docker-compose.yml includes this file, so these commands work
# from the repo root or from infra/docker. Infra services have no profile so a
# plain `up` keeps starting them; `--profile infra` is accepted for clarity.
#
# Kong reads kong/kong.yml (routes to the core-api / realtime / worker
# containers). If you run the backend on the host instead, point Kong at
# kong/kong.local.yml.

x-backend-env: &backend-env
  APP_ENV: development
  DATABASE_URL: postgresql+asyncpg://bhojango:bhojango_dev@postgres:5432/bhojango
  JWT_SECRET: ${JWT_SECRET:-changeme-in-production}  # placeholder; matches kong.local.yml
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localstack:4566

services:
  # ── Databases ─────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bhojango
      POSTGRES_PASSWORD: bhojango_dev
      POSTGRES_DB: bhojango
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhojango"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: bhojango
      POSTGRESQL_PASSWORD: bhojango_dev
      POSTGRESQL_DATABASE: bhojango
      PGBOUNCER_DATABASE: "*"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "1000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_AUTH_TYPE: plain
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── LocalStack (AWS) ─────────────────────
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,sns,s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kong API Gateway ─────────────────────
  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8080"
      KONG_ADMIN_LISTEN: "0.0.0.0:8081"
      KONG_LOG_LEVEL: info
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro

  # ── Backend (3 images; were 7 services) ──
  core-api:
    profiles: ["backend", "all"]
    build:
      context: ../../backend
      dockerfile: core_api/Dockerfile
    environment:
      <<: *backend-env
      SERVICE_NAME: core-api
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    profiles: ["backend", "all"]
    build:
      context: ../../backend
      dockerfile: realtime/Dockerfile
    environment:
      <<: *backend-env
      SERVICE_NAME: delivery-svc
      REDIS_URL: redis://redis:6379/3
      ORDER_SVC_URL: http://core-api:8001
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    profiles: ["backend", "all"]
    build:
      context: ../../backend
      dockerfile: worker/Dockerfile
    environment:
      <<: *backend-env
      SERVICE_NAME: notification-svc
      DB_POOL_SIZE: "5"
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      core-api:
        condition: service_started  # core-api runs the migrations

volumes:
  postgres_data:
  redis_data:
  localstack_data:
