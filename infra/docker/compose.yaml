# BhojanGo local stack. Use the Makefile (make dev / make down / ...), or:
#
#   docker compose --profile infra   up -d   Postgres + PostGIS, Redis, LocalStack
#   docker compose --profile backend up -d   infra + core-api, realtime, worker
#   docker compose --profile all     up -d   backend + web and admin
#
# The repo-root docker-compose.yml includes this file, so these commands work
# from the repo root. There is no gateway: apps and tests call core-api (:8001),
# realtime (:8004) and worker (:8006) directly (ADR-008).
#
# Host ports can be changed if something else already uses them, e.g.
#   POSTGRES_PORT=15432 REDIS_PORT=16379 make dev

name: bhojango

x-backend-env: &backend-env
  APP_ENV: development
  DATABASE_URL: postgresql+asyncpg://bhojango:bhojango_dev@postgres:5432/bhojango
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localstack:4566
  # Every external provider runs locally with no account (backend/shared/providers):
  # fake payments, SMS and push printed to the worker log, email in Mailpit.
  PAYMENT_PROVIDER: fake
  FAKE_PAYMENT_AUTO_COMPLETE_SECONDS: "2"   # fake checkout "pays" after 2 s
  FAKE_PAYMENT_WEBHOOK_URL: http://core-api:8001/api/v1/payments/fake/webhook
  SMS_PROVIDER: log
  PUSH_PROVIDER: log
  EMAIL_PROVIDER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  ROUTING_PROVIDER: straight_line
  # LocalStack queues and topics (infra/docker/localstack/init-aws.sh)
  SQS_QUEUE_URL_NOTIFICATION: http://localstack:4566/000000000000/bhojango-notification-events
  SNS_TOPIC_ARN_ORDER: arn:aws:sns:us-east-1:000000000000:bhojango-order-topic
  SNS_TOPIC_ARN_PAYMENT: arn:aws:sns:us-east-1:000000000000:bhojango-payment-topic
  SNS_TOPIC_ARN_USER: arn:aws:sns:us-east-1:000000000000:bhojango-user-topic
  SNS_TOPIC_ARN_DELIVERY: arn:aws:sns:us-east-1:000000000000:bhojango-driver-topic

x-health-live: &health-live
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  # ── Infra ─────────────────────────────────
  postgres:
    profiles: ["infra", "backend", "all"]
    image: postgis/postgis:16-3.7
    environment:
      POSTGRES_USER: bhojango
      POSTGRES_PASSWORD: bhojango_dev
      POSTGRES_DB: bhojango
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhojango -d bhojango"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: ["infra", "backend", "all"]
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    profiles: ["infra", "backend", "all"]
    image: localstack/localstack:4
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: sqs,sns,s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack:/etc/localstack/init/ready.d:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      # healthy only once init-aws.sh has created the queues, topics and buckets
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/init/ready | grep -Eq '\"completed\": ?true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches every email the backend sends. Inbox: http://localhost:8025
  mailpit:
    profiles: ["infra", "backend", "all"]
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Backend (3 deployables) ───────────────
  core-api:
    profiles: ["backend", "all"]
    build:
      context: ../../backend
      dockerfile: core_api/Dockerfile
    # The image's default command runs `alembic upgrade head`, then uvicorn.
    environment:
      <<: *backend-env
      SERVICE_NAME: core-api
      REDIS_URL: redis://redis:6379/0
      # RS256 dev signing key, created on first start and kept on a volume so
      # tokens survive restarts (production uses JWT_PRIVATE_KEY).
      JWT_DEV_KEY_PATH: /srv/keys/jwt-dev.pem
    ports:
      - "${CORE_API_PORT:-8001}:8001"
    volumes:
      - ../../tools/seed:/srv/tools/seed:ro  # `make seed` runs it in this container
      - jwt_keys:/srv/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      <<: *health-live

  realtime:
    profiles: ["backend", "all"]
    build:
      context: ../../backend
      dockerfile: realtime/Dockerfile
    environment:
      <<: *backend-env
      SERVICE_NAME: delivery-svc
      JWKS_URL: http://core-api:8001/.well-known/jwks.json
      REDIS_URL: redis://redis:6379/3
      ORDER_SVC_URL: http://core-api:8001
    ports:
      - "${REALTIME_PORT:-8004}:8004"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health/live')"]
      <<: *health-live

  worker:
    profiles: ["backend", "all"]
    build:
      context: ../../backend
      dockerfile: worker/Dockerfile
    environment:
      <<: *backend-env
      SERVICE_NAME: notification-svc
      JWKS_URL: http://core-api:8001/.well-known/jwks.json
      DB_POOL_SIZE: "5"
    ports:
      - "${WORKER_PORT:-8006}:8006"
    depends_on:
      core-api:
        condition: service_healthy  # core-api has run the migrations
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health/live')"]
      <<: *health-live

  # ── Web apps ──────────────────────────────
  web:
    profiles: ["all"]
    build:
      context: ../..
      dockerfile: infra/docker/next-app.Dockerfile
      args:
        APP: "@bhojango/web"
        APP_DIR: apps/web
    environment:
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      core-api:
        condition: service_healthy

  admin:
    profiles: ["all"]
    build:
      context: ../..
      dockerfile: infra/docker/next-app.Dockerfile
      args:
        APP: "@bhojango/admin"
        APP_DIR: apps/admin
    environment:
      PORT: "3000"
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    depends_on:
      core-api:
        condition: service_healthy

volumes:
  jwt_keys:
  postgres_data:
  redis_data:
  localstack_data:
