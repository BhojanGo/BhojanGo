# Kong declarative config (backend on the host, Kong in Docker; Kong is removed in P4).
# identity, catalog, orders and payments all run in core_api now; each keeps
# its own Kong service so routes and per-service rate limits are unchanged.
# Kong service names are the pre-P1 ones on purpose.
_format_version: "3.0"
_transform: true

# ── JWT Consumer & Credentials ───────────────
consumers:
  - username: bhojango-services
    jwt_secrets:
      - key: bhojango
        algorithm: HS256
        secret: "${JWT_SECRET:-changeme-in-production}"

services:
  # ── Identity — core_api (was user-svc) ────
  - name: user-svc
    url: http://host.docker.internal:8001
    routes:
      - name: user-auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
      - name: user-routes
        paths:
          - /api/v1/users
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  # ── Catalog — core_api (was restaurant-svc)
  - name: restaurant-svc
    url: http://host.docker.internal:8001
    routes:
      - name: restaurant-routes
        paths:
          - /api/v1/restaurants
        strip_path: false
      - name: search-routes
        paths:
          - /api/v1/search
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  # ── Orders — core_api (was order-svc) ─────
  - name: order-svc
    url: http://host.docker.internal:8001
    routes:
      - name: order-routes
        paths:
          - /api/v1/orders
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  # ── Realtime (was delivery-svc) ───────────
  - name: delivery-svc
    url: http://host.docker.internal:8004
    routes:
      - name: delivery-routes
        paths:
          - /api/v1/delivery
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
      - name: delivery-ws
        paths:
          - /ws
        strip_path: false
        protocols:
          - http
          - https

  # ── Payments — core_api (was payment-svc) ─
  - name: payment-svc
    url: http://host.docker.internal:8001
    routes:
      - name: payment-routes
        paths:
          - /api/v1/payments
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
      - name: wallet-routes
        paths:
          - /api/v1/wallet
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local

  # ── Worker (was notification-svc) ─────────
  - name: notification-svc
    url: http://host.docker.internal:8006
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp

  # ── Batch Engine ───────────────────────────
  - name: batch-engine
    url: http://host.docker.internal:8007
    routes:
      - name: batch-routes
        paths:
          - /api/v1/batch
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              claims_to_verify:
                - exp
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local

# ── Global Plugins ───────────────────────────
plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
        - X-Idempotency-Key
      credentials: true
      max_age: 3600

  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
