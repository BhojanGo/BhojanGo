# The R21 load test's throwaway stack (.github/workflows/load-test.yml), on top of
# compose.yaml. Never QA or production. What changes, and why:
#   - CLIENT_IP_HEADER: each simulated person signs in from their own address (k6
#     sends X-Real-IP, as Railway's edge does), so the per-address sign-in limit
#     doesn't see 140 sign-ins from one load generator.
#   - Access tokens last 2 hours, so the 40-minute run needs no refresh logic.
#   - The fake gateway doesn't pay by itself: k6 confirms each payment, the way the
#     app's checkout does, and times it.
#   - No demo rider: the load test's riders deliver everything.
#   - core-api runs CORE_API_WORKERS uvicorn processes (default 1, as on Railway), each with
#     a pool of 10 + CORE_API_DB_OVERFLOW connections (default 20, the app's default).
#   - tools/soak and target_guard.py in core-api, for tools/soak/setup.py (riders and
#     customers on top of the seed).
services:
  core-api:
    command: ["sh", "-c", "alembic upgrade head && uvicorn core_api.main:app --host 0.0.0.0 --port 8001 --timeout-keep-alive 130 --workers ${CORE_API_WORKERS:-1}"]
    environment:
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "${CORE_API_DB_OVERFLOW:-20}"
      CLIENT_IP_HEADER: X-Real-IP
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      FAKE_PAYMENT_AUTO_COMPLETE_SECONDS: "0"
    volumes:
      - ../../tools/soak:/srv/tools/soak:ro
      - ../../tools/target_guard.py:/srv/tools/target_guard.py:ro
  realtime:
    environment:
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "120"
  worker:
    environment:
      DEMO_RIDER_SIM: "0"
